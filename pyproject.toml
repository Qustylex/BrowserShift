[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "browsershift"
version = "0.2.0"
description = "Switch browsers. Keep your flow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrowserShift Contributors" }]
keywords = ["browser", "migration", "bookmarks", "history", "cli", "tui", "rich"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "rich>=13.7",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
crypto = [
    "pywin32>=306; sys_platform == 'win32'",
]
[project.scripts]
browsershift = "browsershift.main:main"
[project.urls]
Homepage = "https://github.com/BrowserShift/BrowserShift"
Issues = "https://github.com/BrowserShift/BrowserShift/issues"
[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"